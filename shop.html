<!DOCTYPE html>
<html>
<head>
<title>IG BRAND Shop</title>
<style>
  body{font-family:Arial; background:#f5f5f5; text-align:center;}
  .container{display:grid; grid-template-columns:repeat(3,1fr); gap:15px; padding:20px; max-width:900px; margin:auto;}
  .container img{width:100%; height:250px; object-fit:cover; border-radius:10px; cursor:pointer; background:white; border:1px solid #ddd;}
  .lightbox{display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); justify-content:center; align-items:center; z-index:9999;}
  .lightbox img{width:90%; max-width:700px; height:auto; border-radius:10px;}
  #closeBtn{position:absolute; top:20px; right:40px; color:white; font-size:50px; cursor:pointer;}
</style>
</head>
<body>

<h1>IG BRAND - Meri Shop</h1>

<div class="container">
 <img src="photo1.jpg" alt="IG BRAND black kurta design 1">
<img src="photo2.jpg" alt="IG BRAND white shalwar kameez design 2">
<img src="photo3.jpg" alt="IG BRAND stylish kurta for men design 3">
<img src="photo4.jpg" alt="IG BRAND latest collection design 4">
<img src="photo5.jpg" alt="IG BRAND eid collection kurta design 5">
<img src="photo6.jpg" alt="IG BRAND premium kurta design 6">
</div>

<div id="lightbox" class="lightbox">
  <span id="closeBtn">&times;</span>
  <img id="lightboxImg">
</div>

<script>
const images = document.querySelectorAll('.container img');
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightboxImg');
const closeBtn = document.getElementById('closeBtn');

images.forEach(img => {
  img.addEventListener('click', () => {
    lightbox.style.display = 'flex';
    lightboxImg.src = img.src;
  });
});

closeBtn.addEventListener('click', () => { lightbox.style.display = 'none'; });
lightbox.addEventListener('click', (e) => { 
  if(e.target !== lightboxImg) lightbox.style.display = 'none'; 
});
</script>

</body>
</html>
